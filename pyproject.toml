[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynxt2ors"
version = "0.5.1"
description = "Modern 64-bit LEGO NXT/EV3 connector for Open Roberta Lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyUSB>=1.2",
  "requests>=2.31",
  "PySide6>=6.7",
]

[project.scripts]
pynxt2ors = "pynxt2ors.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
